[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idebo"
version = "1.0.0"
description = "Terminálové odjezdy ze zastávek MPVNET.CZ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mpvnet_cz_api>=1.2,<2",
    "requests>=2.28",
]

[project.scripts]
idebo = "idebo_app:cli_entrypoint"

[tool.setuptools]
py-modules = ["idebo_app", "idebo_config", "idebo"]
